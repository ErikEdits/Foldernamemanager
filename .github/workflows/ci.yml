name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint
        run: python -m ruff check ordnerorganisator tests --select F,E9
      - name: Tests
        run: python -m pytest -q

  build-windows:
    name: Windows-Anwendung bauen
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bauen
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - name: Startprobe der Kommandozeile
        shell: pwsh
        run: .\dist\KI-Ordnerorganisator\ki-ordnerorganisator-cli.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: KI-Ordnerorganisator-Windows
          path: dist/KI-Ordnerorganisator
